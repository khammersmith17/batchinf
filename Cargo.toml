[package]
name = "batchinf"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "A drop in harness for dynamic ML inference batching. This is useful to saturate a device (TPU/GPU) and increase throughput for expensive ML inference."
license = "MIT"
repository = "https://github.com/khammersmith17/batchinf"
keywords = ["batching", "inference", "machine-learning", "tokio", "gpu"]
categories = ["science", "asynchronous", "concurrency"]
exclude = ["docs/"]

[dependencies]
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "macros"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
# The tests and the doc example run on the multi-thread runtime.
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
# Captures the crate's tracing events in tests/logging.rs.
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
