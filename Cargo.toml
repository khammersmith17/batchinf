[package]
name = "batchinf"
version = "0.1.0"
edition = "2024"
description = "A drop in harness for static ML batching. This is useful to saturate a device (TPU/GPU) and increase throughput for expensive ML inference."
license = "MIT"

[dependencies]
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
# The tests and the doc example run on the multi-thread runtime.
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
